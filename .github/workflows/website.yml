name: Website

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['web/**', 'deploy/**', 'scripts/check-site.mjs', '.github/workflows/website.yml']
  pull_request:
    paths: ['web/**', 'deploy/**', 'scripts/check-site.mjs', '.github/workflows/website.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Check website and build container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check page, assets and deployment script
        run: |
          node scripts/check-site.mjs
          bash -n deploy/deploy.sh
          shellcheck deploy/deploy.sh deploy/check.sh
          bash deploy/check.sh
      - name: Build and smoke-test Caddy image
        run: |
          set -euo pipefail
          docker build --pull --tag usagewatch-site:test \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" web
          docker run --rm usagewatch-site:test caddy validate --config /etc/caddy/Caddyfile
          docker run -d --name usagewatch-site-test -p 127.0.0.1:6723:80 usagewatch-site:test
          trap 'docker rm -f usagewatch-site-test' EXIT
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:6723/health
          curl --fail http://127.0.0.1:6723/ | grep 'data-site="usagewatch"' >/dev/null
          for asset in styles.css assets/logo.png assets/app-screenshot.png assets/widget-screenshot.png assets/widget-detail-screenshot.png assets/widget-vertical-screenshot.png; do
            curl --fail --silent --output /dev/null "http://127.0.0.1:6723/$asset"
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:6723/missing.png)" = 404
      - name: Publish image to GHCR
        id: publish
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}-web:${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag usagewatch-site:test "$image"
          docker push "$image"
          echo "image=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to usagewatch.seev.pro
    needs: publish
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: [self-hosted, linux, x64, inflows-staging]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    concurrency:
      group: usagewatch-website-deployment
      cancel-in-progress: false
    environment:
      name: staging
      url: https://usagewatch.seev.pro
    steps:
      - uses: actions/checkout@v4
      - name: Deploy verified image with automatic rollback
        env:
          WEB_IMAGE: ${{ needs.publish.outputs.image }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          DOCKER_CONFIG: ${{ runner.temp }}/usagewatch-docker-${{ github.run_id }}
        run: bash deploy/deploy.sh
      - name: Check public HTTPS endpoint
        run: curl --fail --show-error --silent --retry 5 --retry-delay 3 https://usagewatch.seev.pro/ | grep 'data-site="usagewatch"' >/dev/null
      - name: Remove temporary registry credentials
        if: always()
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/usagewatch-docker-${{ github.run_id }}
        run: docker logout ghcr.io
