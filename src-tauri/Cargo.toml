[package]
name = "usagewatch"
version = "0.3.0"
description = "UsageWatch — AI subscription usage in your Windows tray"
authors = ["UsageWatch"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

# The Windows executable links this Rust library; mobile/FFI outputs are unused.
[lib]
name = "usagewatch_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

# DPAPI (CryptProtectData/CryptUnprotectData) for the secure store.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_UI_WindowsAndMessaging",
] }

# single-instance is desktop-only.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# Keep source locations for app backtraces without full variable/type symbols.
[profile.dev]
debug = 1

# Dependency debug symbols dominate disk usage; retain incremental compilation.
[profile.dev.package."*"]
debug = 0

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
